let cart=[],category='すべて';const $=id=>document.getElementById(id);const yen=n=>Number(n).toLocaleString('ja-JP')+'円';function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){try{localStorage.setItem(key,JSON.stringify(menu))}catch(e){}}
function renderTabs(){let cats=['すべて',...new Set(menu.filter(x=>!x.hidden).map(x=>x.cat))];$('tabs').innerHTML=cats.map(x=>'<button class="'+(x===category?'on':'')+'" data-cat="'+escapeHtml(x)+'">'+escapeHtml(x)+'</button>').join('');$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{category=b.dataset.cat;renderTabs();renderItems()})}
function renderItems(){let q=$('search').value.trim();let list=menu.filter(x=>!x.hidden&&(category==='すべて'||x.cat===category)&&(!q||x.name.includes(q)));$('items').innerHTML=list.map(x=>'<button class="item" data-id="'+x.id+'">'+escapeHtml(x.name)+'<span>'+yen(x.price)+'</span></button>').join('')||'<p>商品がありません</p>';$('items').querySelectorAll('button').forEach(b=>b.onclick=()=>add(Number(b.dataset.id)))}
function add(id){let m=menu.find(x=>x.id===id);if(!m)return;let line=cart.find(x=>x.id===id&&x.price===m.price);if(line)line.qty++;else cart.push({id:m.id,name:m.name,price:m.price,qty:1});renderCart()}
function adjust(i,n){if(!cart[i])return;cart[i].qty+=n;if(cart[i].qty<=0)cart.splice(i,1);renderCart()}
function renderCart(){$('cart').innerHTML=cart.length?cart.map((x,i)=>'<div class="line"><div><strong>'+escapeHtml(x.name)+'</strong><br><small>'+yen(x.price)+' × '+x.qty+' = '+yen(x.price*x.qty)+'</small></div><div class="qty"><button data-i="'+i+'" data-d="-1">−</button>'+x.qty+'<button data-i="'+i+'" data-d="1">＋</button></div></div>').join(''):'<div class="empty">左の商品を押してね</div>';$('cart').querySelectorAll('button').forEach(b=>b.onclick=()=>adjust(Number(b.dataset.i),Number(b.dataset.d)));$('total').textContent='合計 '+yen(cart.reduce((s,x)=>s+x.price*x.qty,0))}
function askClear(title,message){
  $('dtitle').textContent=title;
  $('derror').textContent='';
  $('dfields').textContent=message;
  $('dsave').textContent='はい、消す';
  $('dsave').onclick=function(){
    cart=[];renderCart();closeDialog();
    $('dsave').textContent='決定';
  };
  $('dialog').style.display='flex';
}
function clearCart(){
  if(!cart.length){return;}
  askClear('会計を消す','今回のお会計をすべて消しますか？');
}
function finish(){
  if(!cart.length){return;}
  var sum=cart.reduce(function(a,x){return a+x.price*x.qty},0);
  askClear('会計終了・次のお客さん','合計 '+yen(sum)+'。会計を終了して次のお客さんへ進みますか？');
}
function form(title,fields,onSave){$('dsave').textContent='決定';$('dtitle').textContent=title;$('derror').textContent='';$('dfields').innerHTML='';fields.forEach((f,i)=>{let lab=document.createElement('label');lab.textContent=f.label;let el=document.createElement(f.options?'select':'input');el.id='field'+i;if(f.options){f.options.forEach(o=>{let op=document.createElement('option');op.value=o.value;op.textContent=o.label;el.appendChild(op)})}else{el.type=f.number?'number':'text';el.value=f.value||'';if(f.number){el.min='0';el.step='1'}}lab.appendChild(el);$('dfields').appendChild(lab)});$('dsave').onclick=()=>{let vals=fields.map((_,i)=>$('field'+i).value);let err=onSave(vals);if(err)$('derror').textContent=err;else closeDialog()};$('dialog').style.display='flex'}function closeDialog(){$('dialog').style.display='none'}function valid(s){return /^\d+$/.test(String(s))&&Number.isSafeInteger(Number(s))}
function customItem(){form('金額を直接入力',[{label:'商品名',value:'本日の品'},{label:'税込金額（円）',number:true}],([name,p])=>{if(!name.trim())return '商品名を入力してね';if(!valid(p))return '金額を数字で入力してね';cart.push({id:-Date.now(),name:name.trim(),price:Number(p),qty:1});renderCart()})}
function options(){return menu.map(x=>({value:String(x.id),label:x.name+'（'+yen(x.price)+'）'+(x.hidden?'［非表示］':'')}))}
function cats(){return [...new Set(menu.map(x=>x.cat))].map(x=>({value:x,label:x}))}
function addMenu(){form('商品を追加',[{label:'商品名'},{label:'税込金額（円）',number:true},{label:'種類',options:cats()}],([name,p,cat])=>{if(!name.trim())return '商品名を入力してね';if(!valid(p))return '金額を数字で入力してね';menu.push({id:Math.max(...menu.map(x=>x.id),0)+1,name:name.trim(),price:Number(p),cat,hidden:false});save();category=cat;renderTabs();renderItems()})}
function editMenu(){form('商品を変更',[{label:'商品を選ぶ',options:options()},{label:'新しい税込金額（円）',number:true}],([id,p])=>{if(!valid(p))return '金額を数字で入力してね';let m=menu.find(x=>x.id===Number(id));if(!m)return '商品を選んでね';m.price=Number(p);save();renderItems()})}
function toggleMenu(){form('商品を非表示・復活',[{label:'商品を選ぶ',options:options()}],([id])=>{let m=menu.find(x=>x.id===Number(id));if(!m)return '商品を選んでね';m.hidden=!m.hidden;save();renderTabs();renderItems()})}
function resetMenu(){if(confirm('追加・変更した商品データを初期状態に戻しますか？')){menu=base.map(x=>({...x,hidden:false}));save();category='すべて';renderTabs();renderItems()}}
$('warning').style.display='none';renderTabs();renderItems();renderCart();
</script></body></html>
